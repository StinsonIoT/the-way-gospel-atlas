name: TheWay
options:
  bundleIdPrefix: com.stinsoniot
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: The Way
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    CODE_SIGN_STYLE: Automatic
targets:
  TheWay:
    type: application
    platform: iOS
    info:
      path: TheWay/Info.plist
      properties:
        CFBundleDisplayName: The Way
    sources:
      - path: TheWay/Sources
      - path: TheWay/Assets.xcassets
        buildPhase: resources
      - path: TheWay/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: AtlasBundle
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stinsoniot.theway
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: MapLibre
        product: MapLibre
  TheWayUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TheWayUITests
    dependencies:
      - target: TheWay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stinsoniot.theway.uitests
schemes:
  TheWay:
    build:
      targets:
        TheWay: all
    test:
      targets:
        - TheWayUITests
packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 6.31.0

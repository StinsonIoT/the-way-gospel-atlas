name: iOS Build

on:
  push:
    paths:
      - ".github/workflows/ios-build.yml"
      - "ios/**"
      - "js/scenes.js"
      - "js/study.js"
      - "js/guide.js"
      - "js/places.js"
      - "data/**"
      - "tools/export-ios-content.cjs"
  pull_request:
    paths:
      - ".github/workflows/ios-build.yml"
      - "ios/**"
      - "js/scenes.js"
      - "js/study.js"
      - "js/guide.js"
      - "js/places.js"
      - "data/**"
      - "tools/export-ios-content.cjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Export reviewed content
        run: node tools/export-ios-content.cjs
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build for iPhone simulator
        working-directory: ios
        run: >-
          xcodebuild
          -project TheWay.xcodeproj
          -scheme TheWay
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/TheWayDerivedData"
          CODE_SIGNING_ALLOWED=NO
          build
